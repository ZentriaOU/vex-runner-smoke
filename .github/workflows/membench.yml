name: membench

on:
  workflow_dispatch:

jobs:
  mem:
    runs-on: [self-hosted, nordrun-4x16]
    timeout-minutes: 15
    steps:
      - name: host
        run: |
          grep -m1 "model name" /proc/cpuinfo; echo "vCPUs: $(nproc)"
          lscpu | grep -Ei "socket|core|cache|MHz" || true
      - name: install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sysbench >/dev/null
      - name: memory bandwidth vs threads (3 iterations each)
        run: |
          for th in 1 2 4; do
            for i in 1 2 3; do
              r=$(sysbench memory --memory-block-size=1M --memory-total-size=16G \
                    --memory-oper=read --threads=$th run 2>/dev/null \
                  | awk -F'[()]' '/transferred/{print $2}')
              echo "read  threads=$th iter=$i : $r"
            done
          done
          for th in 1 2 4; do
            for i in 1 2 3; do
              r=$(sysbench memory --memory-block-size=1M --memory-total-size=16G \
                    --memory-oper=write --threads=$th run 2>/dev/null \
                  | awk -F'[()]' '/transferred/{print $2}')
              echo "write threads=$th iter=$i : $r"
            done
          done
