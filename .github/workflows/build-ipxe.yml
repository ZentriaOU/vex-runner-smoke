name: build-ipxe

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ipxe/ipxe git ref / tag / branch / SHA
        default: master
        type: string

jobs:
  build:
    runs-on: [self-hosted, vex, linux, x64]
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      REF: ${{ inputs.ref }}

    steps:
      - name: host identity
        run: |
          uname -a
          echo "cpu cores: $(nproc)"
          free -h
          df -h /

      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential perl liblzma-dev mtools xorriso isolinux \
              syslinux-common git ca-certificates
          gcc --version | head -1
          perl --version | head -2 | tail -1

      - name: clone ipxe @ $REF
        run: |
          git clone --depth 1 -b "$REF" https://github.com/ipxe/ipxe ipxe
          cd ipxe
          echo "head: $(git rev-parse HEAD)"

      - name: enable extra iPXE commands (SLEEP, NSLOOKUP, TIME)
        run: |
          # iPXE's default config/general.h leaves SLEEP_CMD commented out;
          # the embedded boot script uses `sleep` for link-wait + DHCP retry
          # backoff. Without this, the script terminates on the first `sleep`
          # call with "unknown command" and iPXE returns to firmware with a
          # non-zero EFI status (which OVMF reports as "Buffer Too Small").
          # Per-build overrides go in config/local/general.h.
          cat > ipxe/src/config/local/general.h <<'EOF'
          #define SLEEP_CMD
          #define NSLOOKUP_CMD
          #define TIME_CMD
          EOF
          cat ipxe/src/config/local/general.h

      - name: build vanilla (EFI + BIOS + lkrn targets)
        run: |
          cd ipxe/src
          make -j"$(nproc)" \
              bin-x86_64-efi/ipxe.efi \
              bin-x86_64-efi/snponly.efi \
              bin/ipxe.lkrn \
              bin/undionly.kpxe \
              bin/ipxe.iso
          mkdir -p ../../out/vanilla
          cp bin-x86_64-efi/ipxe.efi      ../../out/vanilla/
          cp bin-x86_64-efi/snponly.efi   ../../out/vanilla/
          cp bin/ipxe.lkrn                ../../out/vanilla/
          cp bin/undionly.kpxe            ../../out/vanilla/
          cp bin/ipxe.iso                 ../../out/vanilla/

      - name: write embedded boot script (link-wait + dhcp retry)
        run: |
          # Embedded script:
          #   - explicit ifopen net0
          #   - wait up to 15s for link up (${net0/link}==1)
          #   - DHCP with up to 4 retries (sleep 2s between)
          #   - on success, chain http://169.254.169.254/latest/ipxe-script
          # Each failure path drops to interactive shell so we can poke at
          # ifstat / route / dhcp manually from the serial console.
          cat > /tmp/imds-boot.ipxe <<'EOF'
          #!ipxe
          set imds-url http://169.254.169.254/latest/ipxe-script

          echo Opening net0 and waiting for link...
          ifopen net0 || goto noif

          set wait:int8 0
          :link_wait
          iseq ${net0/link} 1 && goto link_up
          sleep 1
          inc wait
          iseq ${wait} 15 && goto link_timeout
          goto link_wait

          :link_up
          echo Link up after ${wait}s (mac ${net0/mac})
          set try:int8 0
          :dhcp_retry
          echo DHCP attempt ${try}...
          dhcp net0 && goto have_ip
          sleep 2
          inc try
          iseq ${try} 4 && goto noip
          goto dhcp_retry

          :have_ip
          echo Got IP ${net0/ip} via ${net0/dhcp-server}
          chain --replace --autofree ${imds-url} || goto fail

          :noif
          echo No net0 interface available
          shell
          :link_timeout
          echo net0 link never came up after 15s
          shell
          :noip
          echo DHCP failed after retries
          shell
          :fail
          echo IMDS chain-load failed
          shell
          EOF
          cat /tmp/imds-boot.ipxe

      - name: build IMDS-bootstrap variant (EMBED=imds-boot.ipxe)
        run: |
          cd ipxe/src
          make clean
          make -j"$(nproc)" EMBED=/tmp/imds-boot.ipxe \
              bin-x86_64-efi/ipxe.efi \
              bin/ipxe.lkrn
          mkdir -p ../../out/imds
          cp bin-x86_64-efi/ipxe.efi  ../../out/imds/ipxe-imds.efi
          cp bin/ipxe.lkrn            ../../out/imds/ipxe-imds.lkrn
          cp /tmp/imds-boot.ipxe      ../../out/imds/embed.ipxe

      - name: build IMDS-bootstrap variant w/ DHCP+netdev debug
        run: |
          # Same embedded script, but compiled with DEBUG=dhcp,netdevice,arp.
          # Produces extremely verbose serial output suitable for diagnosing
          # *why* the initial DHCP attempt fails. Not for production use.
          cd ipxe/src
          make clean
          make -j"$(nproc)" \
              EMBED=/tmp/imds-boot.ipxe \
              DEBUG=dhcp,netdevice,arp,virtio-net \
              bin-x86_64-efi/ipxe.efi
          mkdir -p ../../out/imds-debug
          cp bin-x86_64-efi/ipxe.efi  ../../out/imds-debug/ipxe-imds-debug.efi
          cp /tmp/imds-boot.ipxe      ../../out/imds-debug/embed.ipxe

      - name: artifact info
        run: |
          cd out
          for f in vanilla/* imds/* imds-debug/*; do
              if [ -f "$f" ]; then
                  size=$(stat -c%s "$f")
                  sha=$(sha256sum "$f" | awk '{print $1}')
                  printf "%-44s  %10d bytes  %s\n" "$f" "$size" "$sha"
              fi
          done

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipxe-${{ inputs.ref }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
