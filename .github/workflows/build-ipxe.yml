name: build-ipxe

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ipxe/ipxe git ref / tag / branch / SHA
        default: master
        type: string

jobs:
  build:
    runs-on: [self-hosted, vex, linux, x64]
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      REF: ${{ inputs.ref }}

    steps:
      - name: host identity
        run: |
          uname -a
          echo "cpu cores: $(nproc)"
          free -h
          df -h /

      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential perl liblzma-dev mtools xorriso isolinux \
              syslinux-common git ca-certificates
          gcc --version | head -1
          perl --version | head -2 | tail -1

      - name: clone ipxe @ $REF
        run: |
          git clone --depth 1 -b "$REF" https://github.com/ipxe/ipxe ipxe
          cd ipxe
          echo "head: $(git rev-parse HEAD)"

      - name: build vanilla (EFI + BIOS + lkrn targets)
        run: |
          cd ipxe/src
          # Targets:
          #   bin-x86_64-efi/ipxe.efi        — UEFI x64 (cloud-hypervisor UEFI boot)
          #   bin-x86_64-efi/snponly.efi     — UEFI x64 chainload from existing PXE NIC
          #   bin/ipxe.lkrn                  — Linux kernel format (vex direct-kernel boot)
          #   bin/undionly.kpxe              — legacy PXE chainload
          #   bin/ipxe.iso                   — bootable ISO
          make -j"$(nproc)" \
              bin-x86_64-efi/ipxe.efi \
              bin-x86_64-efi/snponly.efi \
              bin/ipxe.lkrn \
              bin/undionly.kpxe \
              bin/ipxe.iso
          mkdir -p ../../out/vanilla
          cp bin-x86_64-efi/ipxe.efi      ../../out/vanilla/
          cp bin-x86_64-efi/snponly.efi   ../../out/vanilla/
          cp bin/ipxe.lkrn                ../../out/vanilla/
          cp bin/undionly.kpxe            ../../out/vanilla/
          cp bin/ipxe.iso                 ../../out/vanilla/

      - name: build IMDS-bootstrap variant (EMBED=imds-boot.ipxe)
        run: |
          # Embedded script: DHCP for network, then chain-load whatever
          # script the vex controller wrote to metadata_service.ipxe-script.
          # Falls back to interactive shell on failure for debug.
          cat > /tmp/imds-boot.ipxe <<'EOF'
          #!ipxe
          set imds-url http://169.254.169.254/latest/ipxe-script
          dhcp || goto noip
          echo Fetching boot script from ${imds-url}
          chain --replace --autofree ${imds-url} || goto fail
          :noip
          echo No DHCP lease; dropping to shell.
          shell
          :fail
          echo IMDS chain-load failed; dropping to shell.
          shell
          EOF
          cd ipxe/src
          make clean
          make -j"$(nproc)" EMBED=/tmp/imds-boot.ipxe \
              bin-x86_64-efi/ipxe.efi \
              bin/ipxe.lkrn
          mkdir -p ../../out/imds
          cp bin-x86_64-efi/ipxe.efi  ../../out/imds/ipxe-imds.efi
          cp bin/ipxe.lkrn            ../../out/imds/ipxe-imds.lkrn
          cp /tmp/imds-boot.ipxe      ../../out/imds/embed.ipxe

      - name: build IMDS-bootstrap variant w/ SNP disabled (native virtio-net only)
        run: |
          # Patch: force snpnet_supported() to always return -ENOTTY so the
          # UEFI SNP wrapper never binds. iPXE then falls through to its
          # native virtio-net PCI driver, bypassing OVMF's flaky SNP shim.
          cd ipxe/src
          python3 <<'PY'
          from pathlib import Path
          p = Path("drivers/net/efi/snpnet.c")
          src = p.read_text()
          # locate snpnet_supported() body and insert immediate return
          marker = "int snpnet_supported ( EFI_HANDLE device, EFI_GUID *protocol,\n\t\t       int inhibit_wifi ) {\n\tEFI_HANDLE parent;\n\tint rc;\n"
          if marker not in src:
              raise SystemExit("could not find snpnet_supported marker; iPXE source may have changed")
          patched = src.replace(marker, marker + "\n\t/* PATCH: force native driver path under OVMF (SNP receive is buggy with virtio-net) */\n\t( void ) device; ( void ) protocol; ( void ) inhibit_wifi; ( void ) parent; ( void ) rc;\n\treturn -ENOTTY;\n")
          p.write_text(patched)
          PY
          # Verify patch landed
          grep -A2 "PATCH: force native driver path" drivers/net/efi/snpnet.c

          make clean
          make -j"$(nproc)" EMBED=/tmp/imds-boot.ipxe \
              bin-x86_64-efi/ipxe.efi
          mkdir -p ../../out/imds-nosnp
          cp bin-x86_64-efi/ipxe.efi    ../../out/imds-nosnp/ipxe-imds-nosnp.efi
          cp drivers/net/efi/snpnet.c   ../../out/imds-nosnp/snpnet.c.patched

      - name: artifact info
        run: |
          cd out
          for f in vanilla/* imds/*; do
              if [ -f "$f" ]; then
                  size=$(stat -c%s "$f")
                  sha=$(sha256sum "$f" | awk '{print $1}')
                  printf "%-32s  %10d bytes  %s\n" "$f" "$size" "$sha"
              fi
          done

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipxe-${{ inputs.ref }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
