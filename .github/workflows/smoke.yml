name: smoke

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: [self-hosted, nordrun]
    timeout-minutes: 10
    steps:
      - name: identity
        run: |
          echo "::group::hostname / uname"
          hostname
          uname -a
          echo "::endgroup::"

          echo "::group::os-release"
          cat /etc/os-release
          echo "::endgroup::"

          echo "::group::user"
          whoami
          id
          echo "::endgroup::"

      - name: cpu + memory
        run: |
          echo "::group::nproc / cpu model"
          nproc
          grep -m1 "model name" /proc/cpuinfo
          echo "::endgroup::"

          echo "::group::memory"
          free -h
          echo "::endgroup::"

          echo "::group::disk"
          df -h /
          mount | grep -E "vroot|virtiofs" || true
          echo "::endgroup::"

      - name: network
        run: |
          echo "::group::interfaces"
          ip -br a
          echo "::endgroup::"

          echo "::group::routes"
          ip route
          echo "::endgroup::"

          echo "::group::dns"
          cat /etc/resolv.conf
          echo "::endgroup::"

          echo "::group::outbound ip via httpbin"
          curl -sS --max-time 10 https://httpbin.io/ip || echo "(httpbin failed)"
          echo
          echo "::endgroup::"

          echo "::group::outbound ip via ifconfig.co"
          curl -sS --max-time 10 https://ifconfig.co || echo "(ifconfig.co failed)"
          echo
          echo "::endgroup::"

      - name: latency probes
        run: |
          for h in 1.1.1.1 neti.ee 3nv.io github.com; do
            echo "::group::ping $h"
            ping -c 3 -W 2 "$h" 2>&1 | tail -4 || echo "(ping $h failed)"
            echo "::endgroup::"
          done

      - name: environment
        run: |
          echo "::group::env (sorted, secrets redacted by Actions)"
          env | sort
          echo "::endgroup::"

      - name: warren metadata service
        # NOTE: never dump user-data here — the platform embeds the VM login
        # password in it, and this repo's job logs are public.
        run: |
          echo "::group::IMDS instance-id"
          curl -sS --max-time 5 http://169.254.169.254/2009-04-04/meta-data/instance-id || echo "(failed)"
          echo
          echo "::endgroup::"

          echo "::group::IMDS hostname"
          curl -sS --max-time 5 http://169.254.169.254/2009-04-04/meta-data/hostname || echo "(failed)"
          echo
          echo "::endgroup::"

      - name: docker
        run: |
          docker run --rm alpine:latest sh -c 'echo "docker works: $(uname -r)"'

  sized:
    runs-on: [self-hosted, nordrun-4x8]
    timeout-minutes: 10
    steps:
      - name: flavor check
        run: |
          echo "vcpus: $(nproc) (expect 4)"
          echo "mem: $(free -h | awk '/Mem/{print $2}') (expect ~8G)"
          hostname
